name: Optimiser long run

# PRINT-ONLY VERSION, on branch claude/print-results only (12 Oct 2026). Started on this branch, the workflow solves
# nothing: it fetches a pathway run's saved state (artifact state-<name>) and engine check (results-<name>) from the run
# named in source_run and prints them to the job log with .github/print_state.py: every pass's worst-year shed against
# target, the build by year, and the engine check by year. Artifacts cannot be downloaded into the Claude container,
# so this is how the results are read there. The solving workflow is the one on main, claude/build-costs and
# claude/c4-frozen; this branch carries no model code changes and is never merged.

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'A label for this print job (letters, digits, - and _); not a pathway run name'
        required: true
      source_run:
        description: 'The run id whose artifacts to read (for a finished pathway: its last run, which also holds the engine check)'
        required: true
      source_name:
        description: 'The pathway run name, as in state-<name> and results-<name>'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: print-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the inputs
        env:
          LABEL: ${{ inputs.name }}
          SRC_RUN: ${{ inputs.source_run }}
          SRC_NAME: ${{ inputs.source_name }}
        run: |
          [[ "$LABEL" =~ ^[A-Za-z0-9_-]{1,60}$ ]] || { echo "name: letters, digits, - and _ only"; exit 1; }
          [[ "$SRC_RUN" =~ ^[0-9]+$ ]] || { echo "source_run must be a run id"; exit 1; }
          [[ "$SRC_NAME" =~ ^[A-Za-z0-9_-]{1,60}$ ]] || { echo "source_name: letters, digits, - and _ only"; exit 1; }

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch the engine check (finished runs only)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: results-${{ inputs.source_name }}
          path: dl/results
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: Fetch the saved state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: state-${{ inputs.source_name }}
          path: dl/state
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: Print
        env:
          SRC_NAME: ${{ inputs.source_name }}
        run: |
          mkdir -p dl/results dl/state
          python3 -I .github/print_state.py "$SRC_NAME" dl/results dl/state
