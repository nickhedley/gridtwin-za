name: Optimiser long run

# TOP-UP VERSION, on branch claude/topup only (13 Oct 2026, user). Started on this branch, the workflow solves no LP: it
# fetches a finished pathway run's results (artifact results-<name>: the pathway output and its engine check) from the run
# named in source_run and runs the adequacy top-up (harness/topup.js): for each year whose engine-checked mean shed is
# above target, new diesel open-cycle capacity in 250 MW steps until it is at or below target, with the cost of the
# topped-up system and the build caps it breaks. The engine and harness on this branch are those of claude/c4-frozen
# (identical to c4's commit 86bfea4) plus topup.js and an EXTRA_OCGD_MW setting in pathcheck.js that is off by default.
# Mode lpsplit (claude/costsplit only, TODO 14cv, 13 Oct 2026): rebuilds a finished run's last LP from its settings and
# stress windows and splits the objective into components with its cached solution (costsplit_lp.py). Solves nothing.
# The solving workflow is the one on main, claude/build-costs and claude/c4-frozen; this branch is never merged.

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'A label for this top-up job (letters, digits, - and _); not a pathway run name'
        required: true
      source_run:
        description: 'The id of the finished pathway run whose last run holds results-<name>'
        required: true
      source_name:
        description: 'The pathway run name, as in results-<name>'
        required: true
      mode:
        description: 'topup (default): the adequacy top-up; check: re-run the engine check and print gas, diesel and CO2 by year (gasrole.py); lpsplit: split the optimiser objective into components (costsplit_lp.py)'
        default: 'topup'
      settings:
        description: 'lpsplit only: the pathway run settings, KEY=VALUE separated by spaces, exactly as the run used them'
        default: ''
      seed_run:
        description: 'lpsplit only: the run holding state-<seed_name> (the stress windows named in WIN_FROM)'
        default: ''
      seed_name:
        description: 'lpsplit only: the seed pathway run name'
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: topup-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Check the inputs
        env:
          LABEL: ${{ inputs.name }}
          SRC_RUN: ${{ inputs.source_run }}
          SRC_NAME: ${{ inputs.source_name }}
          MODE: ${{ inputs.mode }}
        run: |
          [[ "$LABEL" =~ ^[A-Za-z0-9_-]{1,60}$ ]] || { echo "name: letters, digits, - and _ only"; exit 1; }
          [[ "$SRC_RUN" =~ ^[0-9]+$ ]] || { echo "source_run must be a run id"; exit 1; }
          [[ "$SRC_NAME" =~ ^[A-Za-z0-9_-]{1,60}$ ]] || { echo "source_name: letters, digits, - and _ only"; exit 1; }
          [[ "$MODE" == topup || "$MODE" == check || "$MODE" == lpsplit ]] || { echo "mode: topup, check or lpsplit"; exit 1; }

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install the harness dependencies
        working-directory: harness
        run: |
          npm install --no-save --no-package-lock jsdom@29.1.1 highs@1.15.3
          ln -s .. testroot

      - name: Fetch the pathway and its engine check
        uses: actions/download-artifact@v4
        with:
          name: results-${{ inputs.source_name }}
          path: dl/results
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: Top-up
        if: inputs.mode != 'check'
        working-directory: harness
        env:
          SRC_NAME: ${{ inputs.source_name }}
          SRC_RUN: ${{ inputs.source_run }}
        run: |
          P=$(find ../dl/results -name "pathway_${SRC_NAME}.json" | head -1)
          C=$(find ../dl/results -name "pathcheck_${SRC_NAME}.json" | head -1)
          [ -n "$P" ] && [ -n "$C" ] || { echo "no pathway_${SRC_NAME}.json or pathcheck_${SRC_NAME}.json in run $SRC_RUN"; exit 1; }
          mkdir -p out
          set -o pipefail
          env COMMIT=1 PSE=1 TF=0.5 IN="$P" CHECK="$C" OUT="out/topup_${SRC_NAME}.json" \
            node --max-old-space-size=8192 topup.js 2>&1 | tee "out/topup_${SRC_NAME}.log"

      - name: Engine check with gas, diesel and CO2 by fuel
        if: inputs.mode == 'check'
        working-directory: harness
        env:
          SRC_NAME: ${{ inputs.source_name }}
          SRC_RUN: ${{ inputs.source_run }}
        run: |
          P=$(find ../dl/results -name "pathway_${SRC_NAME}.json" | head -1)
          [ -n "$P" ] || { echo "no pathway_${SRC_NAME}.json in run $SRC_RUN"; exit 1; }
          mkdir -p out
          set -o pipefail
          env COMMIT=1 PSE=1 TF=0.5 IN="$P" OUTC="out/check_${SRC_NAME}.json" node --max-old-space-size=8192 pathcheck.js 2>&1 | tee "out/check_${SRC_NAME}.log"
          python3 -I gasrole.py testroot/index.html "out/check_${SRC_NAME}.json" "$SRC_NAME" | tee "out/gasrole_${SRC_NAME}.txt"

      - name: Fetch the run's saved state (lpsplit)
        if: inputs.mode == 'lpsplit'
        uses: actions/download-artifact@v4
        with:
          name: state-${{ inputs.source_name }}
          path: harness
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: Fetch the seed run's state (lpsplit)
        if: inputs.mode == 'lpsplit' && inputs.seed_run != ''
        uses: actions/download-artifact@v4
        with:
          name: state-${{ inputs.seed_name }}
          path: harness/seed
          run-id: ${{ inputs.seed_run }}
          github-token: ${{ github.token }}

      - name: Split the optimiser objective (lpsplit; rebuilds the LP text, solves nothing)
        if: inputs.mode == 'lpsplit'
        working-directory: harness
        env:
          SRC_NAME: ${{ inputs.source_name }}
          SETTINGS: ${{ inputs.settings }}
        run: |
          mkdir -p out
          set -o pipefail
          ls lpcache | head -20; ls out seed/out 2>/dev/null | head -20
          node costsplit_consts.js 2>/dev/null | tail -1 > out/consts.json
          cat out/consts.json
          env $SETTINGS SOLVER=native TL=72000 DUMP_LP=out/split DUMP_STOP=1 OUT=out/split_dummy.json node --max-old-space-size=8192 pathway/pathway_perfail.js 2>&1 | grep -v -E '^\s+at ' | tail -20
          python3 -I costsplit_lp.py out/split_pass1.lp lpcache "out/pathway_${SRC_NAME}.json" out/consts.json "out/lpsplit_${SRC_NAME}.json" 2040 | tee "out/lpsplit_${SRC_NAME}.txt"
          rm -f out/split_pass1.lp

      - name: Keep the top-up
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topup-${{ inputs.name }}
          path: harness/out
          retention-days: 30
