name: Stress suite

# The suite exercises nodal_engine.js against index.html and the regional data
# files. Its real value in this repo is catching MISMATCHED UPLOADS - a new
# index.html paired with a stale nodal_engine.js, or a data file that never made
# it across - so it is worth keeping on push. The settings below just stop it
# costing time it does not need to.
on:
  push:
    branches: [main]
    paths-ignore:
      # Not exercised by the suite, so a change to these cannot break it.
      - '**.md'
      - 'gridtwin-3d.html'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you trigger a run by hand when you want one

# Successive uploads are common here - a data file, then the engine, then
# index.html. Without this each push queues its own full run and they pile up.
# Cancelling superseded runs means only the latest state gets tested.
concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10      # the suite takes ~20s; anything near this is a hang

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Only the tip commit is needed; skipping history makes checkout
          # noticeably faster on a repo carrying large geojson and profile files.
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run stress suite
        run: node stress_suite.js

      # The stored risk panels (stored_panels.json) belong to one exact page: any change to index.html or to an engine file
      # changes the page's fingerprint, and every visitor then computes the panels live, slowly, with no message (RULES.md,
      # 'Stored risk panels'). This step checks the fingerprint and the file hashes only, no panel computed: about 15 s plus
      # the jsdom install (user, 20 Oct 2026, message 260 (2)). If it fails, run from harness/
      #   node validate_stored_panels.js testroot --write
      # and commit stored_panels.json. The full check (about 25 minutes) stays a local step.
      - name: Stored risk panels match the page (fingerprint only)
        working-directory: harness
        run: |
          npm install --no-save --no-audit --no-fund jsdom@29.1.1
          ln -sfn .. testroot
          node validate_stored_panels.js testroot --fingerprint
