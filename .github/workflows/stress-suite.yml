name: Stress suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stress-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run stress suite
        run: node stress_suite.js
